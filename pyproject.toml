[project]
name = "typesafe-sr-screener"
version = "1.0.0"
description = "Two-stage systematic review screening with TypeSafe's Jev model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.2",
    "httpx>=0.28.1",
    "lxml>=6.1",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "typer>=0.27",
    "streamlit>=1.64",
    "pandas>=3.0",
    "altair>=6.3",
]

[project.scripts]
screener = "screener.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
