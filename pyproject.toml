[project]
name = "typesafe-sr-screener"
version = "0.1.0"
description = "Two-stage systematic review screening with TypeSafe's Jev model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "typer>=0.12",
    "streamlit>=1.40",
    "pandas>=2.2",
    "altair>=5.4",
]

[project.scripts]
screener = "screener.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
